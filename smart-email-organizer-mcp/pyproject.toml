[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-email-organizer-mcp"
version = "0.1.0"
description = "Production-style Smart Email Organizer MCP Server for Gmail using FastMCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.1",
    "google-auth-oauthlib>=1.1.0",
    "pydantic>=2.0.0"
]

[project.scripts]
smart-email-organizer = "server:main"
