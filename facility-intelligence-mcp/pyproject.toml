[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "facility-intelligence-mcp"
version = "0.1.0"
description = "Facility Intelligence MCP: AI-Powered Energy Infrastructure Intelligence and Safe Action Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0"
]

[project.scripts]
facility-intelligence = "server:main"
